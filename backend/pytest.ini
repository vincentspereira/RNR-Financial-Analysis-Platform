[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    -v
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    performance: Performance tests
    security: Security tests
    uat: User acceptance tests
    contract: Contract tests
    chaos: Chaos tests
    compliance: Compliance tests
    slow: Slow running tests
    fast: Fast running tests
    smoke: Smoke tests
    regression: Regression tests
    critical: Critical path tests
    stress: Stress tests
    endurance: Endurance tests
    api: API tests
    database: Database tests
    external: External service tests
    benchmark: Benchmark tests
    penetration: Penetration tests
    encryption: Encryption tests
    auth: Authentication tests
    financial: Financial tests
    monitoring: Monitoring tests
    autoscaling: Autoscaling tests
    configuration: Configuration tests
    e2e: End-to-end tests
    business: Business logic tests
    workflow: Workflow tests
    services: Service tests
asyncio_mode = auto
# NOTE: asyncio_default_fixture_loop_scope requires pytest-asyncio>=0.23 but
# requirements pin 0.21.1, so it is omitted to keep --strict-config happy.
norecursedirs = setup.py venv .venv .test_venv build dist node_modules
timeout = 300
filterwarnings =
    error
    # Third-party libraries (passlib/crypt, python-dateutil, pandas, numpy, etc.)
    # raise import-time DeprecationWarnings on Python 3.12+ that we cannot act on.
    # Ignoring the category broadly keeps the suite collectable; rely on test
    # assertions (not warning escalation) to catch regressions in our own code.
    ignore::DeprecationWarning
    # Pytest internals — informational only, no action required
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*shadows an attribute in parent.*:UserWarning
    ignore:.*model_used.*protected namespace.*:UserWarning
    # Asyncio resource warnings — environment artifacts
    ignore::ResourceWarning
