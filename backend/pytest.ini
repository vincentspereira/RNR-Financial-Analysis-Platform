[tool:pytest]
minversion = 6.0
addopts = -ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --html=reports/pytest_report.html --self-contained-html --json-report --json-report-file=reports/pytest_report.json -v --disable-warnings
testpaths = tests integration_tests system_tests performance_tests security_tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers = 
    unit: Unit tests
    integration: Integration tests
    system: System tests
    performance: Performance tests
    security: Security tests
    uat: User acceptance tests
    contract: Contract tests
    chaos: Chaos tests
    compliance: Compliance tests
    slow: Slow running tests
    stress: Stress tests
    endurance: Endurance tests
    api: API tests
    database: Database tests
    auth: Authentication tests
    financial: Financial tests
    monitoring: Monitoring tests
    autoscaling: Autoscaling tests
    configuration: Configuration tests
    e2e: End-to-end tests
    business: Business logic tests
    workflow: Workflow tests
    services: Service tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
collect_ignore = setup.py venv build dist
timeout = 300
filterwarnings =
     ignore::DeprecationWarning
     ignore::PendingDeprecationWarning
     ignore::PytestDeprecationWarning
     ignore::PytestRemovedIn9Warning
     ignore::PytestUnknownMarkWarning
     ignore::UserWarning
     ignore::FutureWarning
     ignore:.*utcnow.*:DeprecationWarning
     ignore:.*Pydantic.*:DeprecationWarning
     ignore:.*async.*fixture.*:PytestRemovedIn9Warning
     ignore:Unknown pytest.mark.*:PytestUnknownMarkWarning