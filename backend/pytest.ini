[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    -v
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    performance: Performance tests
    security: Security tests
    uat: User acceptance tests
    contract: Contract tests
    chaos: Chaos tests
    compliance: Compliance tests
    slow: Slow running tests
    fast: Fast running tests
    smoke: Smoke tests
    regression: Regression tests
    critical: Critical path tests
    stress: Stress tests
    endurance: Endurance tests
    api: API tests
    database: Database tests
    external: External service tests
    benchmark: Benchmark tests
    penetration: Penetration tests
    encryption: Encryption tests
    auth: Authentication tests
    financial: Financial tests
    monitoring: Monitoring tests
    autoscaling: Autoscaling tests
    configuration: Configuration tests
    e2e: End-to-end tests
    business: Business logic tests
    workflow: Workflow tests
    services: Service tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs = setup.py venv .venv .test_venv build dist node_modules
timeout = 300
filterwarnings =
    error
    # Pytest internals — informational only, no action required
    ignore::pytest.PytestUnraisableExceptionWarning
    # Third-party deprecations we can't control
    ignore:Support for class-based `config` is deprecated.*:DeprecationWarning:pydantic
    ignore:.*shadows an attribute in parent.*:UserWarning
    # Asyncio resource warnings — Windows test artifacts
    ignore::ResourceWarning
