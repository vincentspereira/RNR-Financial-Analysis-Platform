# Staging ingress (staging.rnr-financial-analysis-platform.com).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rnr-financial-analysis-platform-staging
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.rnr-financial-analysis-platform.com
      secretName: staging-tls
  rules:
    - host: staging.rnr-financial-analysis-platform.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
