global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'financial-platform'
    environment: 'production'

rule_files:
  - '/etc/prometheus/rules/*.yaml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/api/v1/monitoring/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'

  - job_name: 'frontend'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['frontend:80']
        labels:
          service: 'frontend'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
