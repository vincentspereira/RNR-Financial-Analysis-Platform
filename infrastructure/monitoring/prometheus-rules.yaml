apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: financial-platform-alerts
  namespace: monitoring
  labels:
    app: financial-platform
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: financial-platform.rules
    interval: 30s
    rules:
    
    # Application Health Alerts
    - alert: ApplicationDown
      expr: up{job=~"backend-service|frontend-service"} == 0
      for: 1m
      labels:
        severity: critical
        service: "{{ $labels.job }}"
      annotations:
        summary: "Financial Platform service is down"
        description: "{{ $labels.job }} has been down for more than 1 minute"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/service-down"
    
    - alert: HighErrorRate
      expr: |
        (
          rate(http_requests_total{job="backend-service",status=~"5.."}[5m]) /
          rate(http_requests_total{job="backend-service"}[5m])
        ) * 100 > 5
      for: 2m
      labels:
        severity: warning
        service: backend
      annotations:
        summary: "High error rate detected"
        description: "Backend error rate is {{ $value }}% over the last 5 minutes"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/high-error-rate"
    
    - alert: CriticalErrorRate
      expr: |
        (
          rate(http_requests_total{job="backend-service",status=~"5.."}[5m]) /
          rate(http_requests_total{job="backend-service"}[5m])
        ) * 100 > 10
      for: 1m
      labels:
        severity: critical
        service: backend
      annotations:
        summary: "Critical error rate detected"
        description: "Backend error rate is {{ $value }}% over the last 5 minutes"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/critical-error-rate"
    
    # Performance Alerts
    - alert: HighResponseTime
      expr: |
        histogram_quantile(0.95, 
          rate(http_request_duration_seconds_bucket{job="backend-service"}[5m])
        ) > 2
      for: 3m
      labels:
        severity: warning
        service: backend
      annotations:
        summary: "High response time detected"
        description: "95th percentile response time is {{ $value }}s over the last 5 minutes"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/high-response-time"
    
    - alert: DatabaseSlowQueries
      expr: |
        rate(database_query_duration_seconds_sum{job="backend-service"}[5m]) /
        rate(database_query_duration_seconds_count{job="backend-service"}[5m]) > 1
      for: 2m
      labels:
        severity: warning
        service: database
      annotations:
        summary: "Database queries are slow"
        description: "Average database query time is {{ $value }}s over the last 5 minutes"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/slow-database"
    
    # Resource Alerts
    - alert: HighCPUUsage
      expr: |
        (
          rate(container_cpu_usage_seconds_total{pod=~"backend-deployment-.*|frontend-deployment-.*"}[5m]) * 100
        ) > 80
      for: 5m
      labels:
        severity: warning
        service: "{{ $labels.pod }}"
      annotations:
        summary: "High CPU usage detected"
        description: "Pod {{ $labels.pod }} CPU usage is {{ $value }}%"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/high-cpu"
    
    - alert: HighMemoryUsage
      expr: |
        (
          container_memory_working_set_bytes{pod=~"backend-deployment-.*|frontend-deployment-.*"} /
          container_spec_memory_limit_bytes{pod=~"backend-deployment-.*|frontend-deployment-.*"}
        ) * 100 > 85
      for: 3m
      labels:
        severity: warning
        service: "{{ $labels.pod }}"
      annotations:
        summary: "High memory usage detected"
        description: "Pod {{ $labels.pod }} memory usage is {{ $value }}%"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/high-memory"
    
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{pod=~"backend-deployment-.*|frontend-deployment-.*"}[15m]) > 0
      for: 1m
      labels:
        severity: critical
        service: "{{ $labels.pod }}"
      annotations:
        summary: "Pod is crash looping"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/crash-loop"
    
    # Database Alerts
    - alert: DatabaseConnectionsHigh
      expr: |
        postgresql_connections_active{job="postgresql"} /
        postgresql_connections_max{job="postgresql"} * 100 > 80
      for: 2m
      labels:
        severity: warning
        service: database
      annotations:
        summary: "Database connections are high"
        description: "PostgreSQL connection usage is {{ $value }}%"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/db-connections"
    
    - alert: DatabaseDown
      expr: up{job="postgresql"} == 0
      for: 1m
      labels:
        severity: critical
        service: database
      annotations:
        summary: "Database is down"
        description: "PostgreSQL database has been down for more than 1 minute"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/db-down"
    
    # Redis Alerts
    - alert: RedisDown
      expr: up{job="redis"} == 0
      for: 1m
      labels:
        severity: critical
        service: redis
      annotations:
        summary: "Redis is down"
        description: "Redis has been down for more than 1 minute"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/redis-down"
    
    - alert: RedisMemoryHigh
      expr: |
        redis_memory_used_bytes{job="redis"} /
        redis_memory_max_bytes{job="redis"} * 100 > 85
      for: 3m
      labels:
        severity: warning
        service: redis
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis memory usage is {{ $value }}%"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/redis-memory"
    
    # Business Logic Alerts
    - alert: MLModelPredictionFailures
      expr: |
        rate(ml_prediction_failures_total{job="backend-service"}[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
        service: ml-service
      annotations:
        summary: "ML model prediction failures detected"
        description: "ML prediction failure rate is {{ $value }} per second"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/ml-failures"
    
    - alert: ReportGenerationFailures
      expr: |
        rate(report_generation_failures_total{job="backend-service"}[5m]) > 0.05
      for: 2m
      labels:
        severity: warning
        service: reporting
      annotations:
        summary: "Report generation failures detected"
        description: "Report generation failure rate is {{ $value }} per second"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/report-failures"
    
    - alert: WebSocketConnectionsHigh
      expr: websocket_active_connections{job="backend-service"} > 1000
      for: 5m
      labels:
        severity: warning
        service: websocket
      annotations:
        summary: "High number of WebSocket connections"
        description: "Active WebSocket connections: {{ $value }}"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/websocket-connections"
    
    # Security Alerts
    - alert: HighFailedLoginAttempts
      expr: |
        rate(auth_login_failures_total{job="backend-service"}[5m]) > 1
      for: 1m
      labels:
        severity: warning
        service: auth
      annotations:
        summary: "High number of failed login attempts"
        description: "Failed login rate is {{ $value }} per second"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/failed-logins"
    
    - alert: SuspiciousActivity
      expr: |
        rate(security_violations_total{job="backend-service"}[5m]) > 0.1
      for: 1m
      labels:
        severity: critical
        service: security
      annotations:
        summary: "Suspicious security activity detected"
        description: "Security violation rate is {{ $value }} per second"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/security-violations"
    
    # Infrastructure Alerts
    - alert: DiskSpaceHigh
      expr: |
        (
          node_filesystem_avail_bytes{mountpoint="/"} /
          node_filesystem_size_bytes{mountpoint="/"}
        ) * 100 < 15
      for: 5m
      labels:
        severity: warning
        service: infrastructure
      annotations:
        summary: "Disk space is running low"
        description: "Available disk space is {{ $value }}%"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/disk-space"
    
    - alert: LoadBalancerDown
      expr: |
        probe_success{job="blackbox", instance=~"https://financial-analysis-platform.com.*"} == 0
      for: 1m
      labels:
        severity: critical
        service: loadbalancer
      annotations:
        summary: "Load balancer health check failed"
        description: "External health check for {{ $labels.instance }} is failing"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/lb-down"
    
    # SLA Alerts
    - alert: SLAViolation
      expr: |
        (
          rate(http_requests_total{job="backend-service",status!~"5.."}[5m]) /
          rate(http_requests_total{job="backend-service"}[5m])
        ) * 100 < 99.5
      for: 5m
      labels:
        severity: critical
        service: sla
      annotations:
        summary: "SLA violation detected"
        description: "Service availability is {{ $value }}% (SLA: 99.5%)"
        runbook_url: "https://docs.financial-analysis-platform.com/runbooks/sla-violation"

  - name: financial-platform.recording-rules
    interval: 30s
    rules:
    
    # Recording rules for dashboards
    - record: financial_platform:request_rate
      expr: |
        sum(rate(http_requests_total{job="backend-service"}[5m])) by (method, endpoint)
    
    - record: financial_platform:error_rate
      expr: |
        sum(rate(http_requests_total{job="backend-service",status=~"5.."}[5m])) by (method, endpoint) /
        sum(rate(http_requests_total{job="backend-service"}[5m])) by (method, endpoint)
    
    - record: financial_platform:response_time_p95
      expr: |
        histogram_quantile(0.95, 
          sum(rate(http_request_duration_seconds_bucket{job="backend-service"}[5m])) by (le, method, endpoint)
        )
    
    - record: financial_platform:response_time_p99
      expr: |
        histogram_quantile(0.99, 
          sum(rate(http_request_duration_seconds_bucket{job="backend-service"}[5m])) by (le, method, endpoint)
        )
    
    - record: financial_platform:database_query_rate
      expr: |
        sum(rate(database_queries_total{job="backend-service"}[5m])) by (query_type)
    
    - record: financial_platform:cache_hit_rate
      expr: |
        sum(rate(cache_hits_total{job="backend-service"}[5m])) /
        sum(rate(cache_requests_total{job="backend-service"}[5m]))
    
    - record: financial_platform:websocket_connections
      expr: |
        sum(websocket_active_connections{job="backend-service"})
    
    - record: financial_platform:ml_predictions_rate
      expr: |
        sum(rate(ml_predictions_total{job="backend-service"}[5m])) by (model_type)
    
    - record: financial_platform:report_generation_rate
      expr: |
        sum(rate(reports_generated_total{job="backend-service"}[5m])) by (report_type)