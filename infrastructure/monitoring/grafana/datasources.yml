apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"
      queryTimeout: "60s"

  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: financial_analysis
    user: postgres
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false

  - name: Redis
    type: redis-datasource
    url: redis://redis:6379
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
    editable: false
