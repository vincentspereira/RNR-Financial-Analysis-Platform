# Staging frontend deployment (static build served by nginx).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: staging
  labels:
    app.kubernetes.io/name: rnr-financial-analysis-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rnr-financial-analysis-platform
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rnr-financial-analysis-platform
        app.kubernetes.io/component: frontend
        app.kubernetes.io/environment: staging
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rnr-financial-analysis-platform/frontend:staging
          imagePullPolicy: Always
          ports:
            - name: http-web
              containerPort: 80
          env:
            - name: VITE_API_URL
              value: https://staging.rnr-financial-analysis-platform.com/api/v1
          readinessProbe:
            httpGet:
              path: /
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
